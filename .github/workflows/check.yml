name: P1 foundation checks
on:
  pull_request:
  push:
    branches: [main, 'feat/p1-*']
permissions:
  contents: read
jobs:
  check:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest may move to newer releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: npm ci --prefix frontend
      - run: python scripts/project.py check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/project.py browser
      - name: Verify browser against real workflow API and Python execution
        run: python scripts/verify_browser_workflow.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/test-results/
            .olympus/browser-workflow-*/
